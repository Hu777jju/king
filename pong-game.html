<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pong Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            font-family: 'Arial', sans-serif;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        h1 {
            color: white;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
            font-size: 2.5em;
            letter-spacing: 2px;
        }

        .scoreboard {
            display: flex;
            gap: 60px;
            font-size: 1.8em;
            color: white;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
            font-weight: bold;
        }

        .score {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .score-label {
            font-size: 0.7em;
            opacity: 0.8;
            letter-spacing: 1px;
        }

        .score-value {
            font-size: 1.5em;
            min-width: 60px;
            text-align: center;
        }

        #gameCanvas {
            border: 4px solid white;
            background: radial-gradient(ellipse at center, #1a1a2e 0%, #0f0f1e 100%);
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.2);
            display: block;
        }

        .controls {
            color: white;
            text-align: center;
            font-size: 0.95em;
            line-height: 1.6;
            opacity: 0.9;
        }

        .controls strong {
            color: #ffd700;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 1.8em;
            }

            .scoreboard {
                gap: 40px;
                font-size: 1.4em;
            }

            #gameCanvas {
                max-width: 90vw;
                height: auto;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 PONG GAME 🎮</h1>
        
        <div class="scoreboard">
            <div class="score">
                <div class="score-label">PLAYER</div>
                <div class="score-value" id="playerScore">0</div>
            </div>
            <div class="score">
                <div class="score-label">COMPUTER</div>
                <div class="score-value" id="computerScore">0</div>
            </div>
        </div>

        <canvas id="gameCanvas" width="800" height="400"></canvas>

        <div class="controls">
            <p><strong>Controls:</strong></p>
            <p>🖱️ Move Mouse UP/DOWN or use ⬆️ ⬇️ Arrow Keys</p>
            <p>Press <strong>SPACE</strong> to start/pause game</p>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Game objects
        const paddleWidth = 10;
        const paddleHeight = 80;
        const ballSize = 6;

        const player = {
            x: 20,
            y: canvas.height / 2 - paddleHeight / 2,
            width: paddleWidth,
            height: paddleHeight,
            dy: 0,
            speed: 6
        };

        const computer = {
            x: canvas.width - 20 - paddleWidth,
            y: canvas.height / 2 - paddleHeight / 2,
            width: paddleWidth,
            height: paddleHeight,
            dy: 0,
            speed: 4
        };

        const ball = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            dx: 5,
            dy: 5,
            radius: ballSize,
            speed: 5
        };

        let playerScore = 0;
        let computerScore = 0;
        let gameRunning = false;
        let keys = {};

        // Event listeners
        document.addEventListener('keydown', (e) => {
            keys[e.key] = true;
            if (e.key === ' ') {
                e.preventDefault();
                gameRunning = !gameRunning;
            }
        });

        document.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });

        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mouseY = e.clientY - rect.top;
            player.y = mouseY - player.height / 2;
            // Clamp player position
            if (player.y < 0) player.y = 0;
            if (player.y + player.height > canvas.height) {
                player.y = canvas.height - player.height;
            }
        });

        // Update player position with arrow keys
        function updatePlayer() {
            if (keys['ArrowUp']) {
                player.y -= player.speed;
            }
            if (keys['ArrowDown']) {
                player.y += player.speed;
            }
            // Clamp player position
            if (player.y < 0) player.y = 0;
            if (player.y + player.height > canvas.height) {
                player.y = canvas.height - player.height;
            }
        }

        // Update computer AI
        function updateComputer() {
            const computerCenter = computer.y + computer.height / 2;
            const ballCenter = ball.y;

            if (computerCenter < ballCenter - 35) {
                computer.y += computer.speed;
            } else if (computerCenter > ballCenter + 35) {
                computer.y -= computer.speed;
            }

            // Clamp computer position
            if (computer.y < 0) computer.y = 0;
            if (computer.y + computer.height > canvas.height) {
                computer.y = canvas.height - computer.height;
            }
        }

        // Update ball position
        function updateBall() {
            ball.x += ball.dx;
            ball.y += ball.dy;

            // Ball collision with top and bottom walls
            if (ball.y - ball.radius < 0) {
                ball.y = ball.radius;
                ball.dy = -ball.dy;
            }
            if (ball.y + ball.radius > canvas.height) {
                ball.y = canvas.height - ball.radius;
                ball.dy = -ball.dy;
            }

            // Ball collision with paddles
            if (
                ball.x - ball.radius < player.x + player.width &&
                ball.y > player.y &&
                ball.y < player.y + player.height
            ) {
                ball.x = player.x + player.width + ball.radius;
                ball.dx = -ball.dx;
                // Add spin based on where ball hits paddle
                const hitPos = (ball.y - player.y) / player.height - 0.5;
                ball.dy += hitPos * 5;
            }

            if (
                ball.x + ball.radius > computer.x &&
                ball.y > computer.y &&
                ball.y < computer.y + computer.height
            ) {
                ball.x = computer.x - ball.radius;
                ball.dx = -ball.dx;
                // Add spin based on where ball hits paddle
                const hitPos = (ball.y - computer.y) / computer.height - 0.5;
                ball.dy += hitPos * 5;
            }

            // Score points
            if (ball.x - ball.radius < 0) {
                computerScore++;
                resetBall();
                document.getElementById('computerScore').textContent = computerScore;
            }
            if (ball.x + ball.radius > canvas.width) {
                playerScore++;
                resetBall();
                document.getElementById('playerScore').textContent = playerScore;
            }
        }

        // Reset ball to center
        function resetBall() {
            ball.x = canvas.width / 2;
            ball.y = canvas.height / 2;
            ball.dx = (Math.random() > 0.5 ? 1 : -1) * ball.speed;
            ball.dy = (Math.random() - 0.5) * ball.speed;
        }

        // Draw functions
        function drawPaddle(paddle) {
            ctx.fillStyle = '#00ff88';
            ctx.shadowColor = 'rgba(0, 255, 136, 0.5)';
            ctx.shadowBlur = 15;
            ctx.fillRect(paddle.x, paddle.y, paddle.width, paddle.height);
            ctx.shadowColor = 'transparent';
        }

        function drawBall() {
            ctx.fillStyle = '#ffff00';
            ctx.shadowColor = 'rgba(255, 255, 0, 0.7)';
            ctx.shadowBlur = 20;
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowColor = 'transparent';
        }

        function drawCenterLine() {
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
            ctx.setLineDash([10, 10]);
            ctx.beginPath();
            ctx.moveTo(canvas.width / 2, 0);
            ctx.lineTo(canvas.width / 2, canvas.height);
            ctx.stroke();
            ctx.setLineDash([]);
        }

        function drawGameStatus() {
            if (!gameRunning) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#ffff00';
                ctx.font = 'bold 30px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('PRESS SPACE TO START', canvas.width / 2, canvas.height / 2);
            }
        }

        // Main game loop
        function gameLoop() {
            // Clear canvas
            ctx.fillStyle = 'rgba(26, 26, 46, 0.1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw center line
            drawCenterLine();

            // Update
            updatePlayer();
            updateComputer();

            if (gameRunning) {
                updateBall();
            }

            // Draw
            drawPaddle(player);
            drawPaddle(computer);
            drawBall();
            drawGameStatus();

            requestAnimationFrame(gameLoop);
        }

        // Start game loop
        gameLoop();
    </script>
</body>
</html>
